spring.application.name=driver-vehicle-service
server.port=${SERVER_PORT:8082}
spring.data.mongodb.host=${MONGODB_HOST:localhost}
spring.data.mongodb.port=${MONGODB_PORT:27017}
spring.data.mongodb.database=${MONGODB_DATABASE:ridelink_driver_vehicle_db}
account.service.url=${ACCOUNT_SERVICE_URL:http://localhost:8081}
jwt.secret=${JWT_SECRET:RideLinkDevelopmentSecretKey2026ForAuthentication123456789}
jwt.expiration=${JWT_EXPIRATION:86400000}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
