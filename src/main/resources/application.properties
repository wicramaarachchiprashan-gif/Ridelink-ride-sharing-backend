spring.application.name=ride-management-service

server.port=8083

spring.data.mongodb.uri=mongodb://localhost:27017/ridelink_ride_db

# JWT - same secret as Account Service so tokens issued there are valid here
jwt.secret=${JWT_SECRET:RideLinkDevelopmentSecretKey2026ForAuthentication123456789}
jwt.expiration=86400000

# Actuator
management.endpoints.web.exposure.include=health,info

# Interservice communication URLs
account.service.url=${ACCOUNT_SERVICE_URL:http://localhost:8081}
driver.service.url=${DRIVER_SERVICE_URL:http://localhost:8082}
