# =========================================================
# Application Configuration - Member 2 (Driver & Vehicle Service)
# =========================================================

# Application Name
spring.application.name=driver-vehicle-service

# Driver & Vehicle Service Port
server.port=8082


# =========================================================
# MongoDB Configuration (Database-per-Service Pattern)
# =========================================================

# Dedicated MongoDB database for Driver & Vehicle Service
# Collections: drivers, vehicles
driver.service.mongodb.uri=mongodb://localhost:27017/ridelink_driver_vehicle_db


# =========================================================
# JWT Authentication
# =========================================================

# Development secret matching Account Service for validating incoming Bearer tokens
# For production/deployment, override via environment variable JWT_SECRET
jwt.secret=${JWT_SECRET:RideLinkDevelopmentSecretKey2026ForAuthentication123456789}

# Token lifetime = 24 hours (86,400,000 ms)
jwt.expiration=86400000


# =========================================================
# Interservice Communication
# =========================================================

# Account Service (Member 1) base URL for validating driver account IDs & roles
account.service.url=${ACCOUNT_SERVICE_URL:http://localhost:8081}


# =========================================================
# Actuator Monitoring
# =========================================================

# Expose health and info endpoints for service health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
