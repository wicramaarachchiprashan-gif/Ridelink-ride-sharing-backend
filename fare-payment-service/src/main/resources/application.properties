spring.application.name=fare-payment-service
server.port=8084

# Exact property required for MongoDB auto-configuration
spring.data.mongodb.uri=mongodb://localhost:27017/ridelink_fare_payment_db

# JWT - same secret as Account Service
jwt.secret=${JWT_SECRET:RideLinkDevelopmentSecretKey2026ForAuthentication123456789}
jwt.expiration=86400000

# Actuator
management.endpoints.web.exposure.include=health,info

# Interservice communication URLs
ride.service.url=${RIDE_SERVICE_URL:http://localhost:8083}
